name: Publish npm early access

on:
  workflow_dispatch:
    inputs:
      tag:
        description: npm dist-tag
        required: true
        default: next
        type: choice
        options:
          - next
          - latest

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      # Trusted Publishing requires npm 11.5.1 or newer. Pin the release CLI so
      # the workflow does not inherit the older npm bundled with Node 22.
      - run: npm install --global npm@11.15.0
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      # n8n-node prerelease intentionally blocks a raw npm lifecycle publish.
      # The workflow has already run all release gates, so publish the verified
      # package while skipping only that duplicate lifecycle hook.
      - run: npm publish --ignore-scripts --access public --provenance --tag "${{ inputs.tag }}"
