name: logali-sap-rfc-provision

services:
  sap-rfc-provision:
    image: logali-sap-rfc-guard-jco:0.3.0
    container_name: sap-rfc-provision-jco
    restart: unless-stopped
    working_dir: /tmp
    env_file:
      - /srv/sap-rfc-guard/secrets/sap-rfc-provision.env
    volumes:
      - /srv/sap-rfc-guard/vendor/sap-jco:/opt/sap/jco:ro
      - /srv/sap-rfc-guard/tls/sap-rfc-provision-jco/server.p12:/run/secrets/sap-rfc-guard-server.p12:ro
    networks:
      - n8n_backend
      - sap_egress
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 384m
    cpus: 0.5
    expose:
      - "8080"

networks:
  n8n_backend:
    external: true
    name: n8n_backend
  sap_egress:
    external: true
    name: logali_sap_rfc_egress
