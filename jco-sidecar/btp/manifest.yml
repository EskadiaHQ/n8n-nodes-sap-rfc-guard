---
applications:
  - name: btp-rfc-guard-415
    path: ../target/sap-rfc-guard-sidecar.war
    memory: 768M
    disk_quota: 1G
    instances: 1
    buildpacks:
      - sap_java_buildpack_jakarta
    health-check-type: process
    env:
      USE_JCO: "true"
      SAP_USE_MANAGED_DESTINATION: "true"
      SAP_DESTINATION_NAME: S4HANA_2025_A4H_RFC
      RFC_GUARD_BIND_ADDRESS: 0.0.0.0
      RFC_GUARD_MODE: read-only
      RFC_GUARD_MAX_ROWS: 20
      RFC_GUARD_INACTIVE_DAYS: 90
      RFC_GUARD_REQUEST_TIMEOUT_SECONDS: 30
    services:
      - destination-415-guard
      - connectivity-415-guard
      - xsuaa-415-guard
      - rfc-guard-secrets-415
